# PostgreSQL local para desarrollo (doc 06 §14). Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: huertos
      POSTGRES_USER: ${DB_USER:-huertos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huertos}
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con un PostgreSQL local
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huertos} -d huertos"]
      interval: 5s
      retries: 10

volumes:
  datos-postgres:
