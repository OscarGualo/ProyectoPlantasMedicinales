# Entorno local (doc 06 §14).
#   Solo la base, para desarrollar:        docker compose up -d
#   La aplicación completa en contenedores: docker compose --profile app up -d --build   → http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: huertos
      POSTGRES_USER: ${DB_USER:-huertos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huertos}
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con un PostgreSQL local
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Crea la base huertos_e2e de las pruebas en navegador (solo al crear el volumen por primera vez).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huertos} -d huertos"]
      interval: 5s
      retries: 10

  # Aplicación completa (frontend + backend en una imagen). Solo arranca con --profile app.
  app:
    profiles: ["app"]
    build: .
    image: huertos-medicinales
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/huertos
      DB_USER: ${DB_USER:-huertos}
      DB_PASSWORD: ${DB_PASSWORD:-huertos}
      # Contraseña de los líderes de demostración; se fija la primera vez que se crea la base (ver .env.example).
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # En local se usa http; en el hosting con https debe quedar en true (valor por defecto de la imagen).
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  datos-postgres:
